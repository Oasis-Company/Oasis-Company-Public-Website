<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>ceaserzhao · project</title>
  <meta name="description" content="ceaserzhao — selected projects." />
  <style>
    :root { --red: #e60000; }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; }
    body {
      background: #fff;
      color: #000;
      font-family: "SFMono-Regular", "SF Mono", "JetBrains Mono", "Fira Code",
                   Menlo, Consolas, "Liberation Mono", monospace;
      min-height: 100svh;
      padding: clamp(3rem, 9vh, 7rem) 1.5rem 4rem;
      display: flex;
      justify-content: center;
    }
    .col { width: 100%; max-width: 640px; }
    .back {
      display: inline-block;
      font-size: 0.78rem;
      letter-spacing: 0.16em;
      text-transform: lowercase;
      color: #000;
      text-decoration: none;
      border-bottom: 1px solid #000;
      padding-bottom: 3px;
      margin-bottom: 3.2rem;
      opacity: 0;
      animation: fade 1s ease 0.1s both;
    }
    .back:hover { color: var(--red); border-color: var(--red); }
    h1 {
      font-size: 1.3rem;
      font-weight: 600;
      letter-spacing: 0.01em;
      margin-bottom: 2.2rem;
      opacity: 0;
      animation: fadeUp 0.9s cubic-bezier(0.16, 1, 0.3, 1) both;
      animation-delay: 0.25s;
    }
    .intro {
      font-size: 1.02rem;
      line-height: 1.9;
      opacity: 0;
      animation: fadeUp 0.9s cubic-bezier(0.16, 1, 0.3, 1) both;
      animation-delay: 0.4s;
    }
    .intro a { color: var(--red); text-decoration: none; border-bottom: 1px solid var(--red); padding-bottom: 1px; }
    .intro a:hover { opacity: 0.7; }
    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(14px); }
      to   { opacity: 1; transform: translateY(0); }
    }
    @keyframes fade {
      from { opacity: 0; }
      to   { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      .back, h1, .intro { animation: none; opacity: 1; transform: none; }
    }
  </style>
</head>
<body>
  <div class="col">
    <a class="back" href="/people/ceaserzhao/info">&larr; info</a>

    <h1>projects</h1>

    <p class="intro">Selected projects &mdash; to be added. <a href="/people/ceaserzhao/info">back to info</a></p>
  </div>
</body>
</html>
